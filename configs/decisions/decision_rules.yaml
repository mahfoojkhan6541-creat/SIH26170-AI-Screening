decision_policy_version: "dec_v2"
description: "Operational disposition policy adhering to Section 30 & 31: Explicit decoupling of IF Anomaly Thresholds, Engineering Specification Limits, and GPR Safety Slopes."

thresholds:
  # 1. Isolation Forest Anomaly Thresholds (Purely unsupervised statistical metric)
  # Learns multivariate trajectory rarity without requiring engineering limits.
  isolation_forest:
    watch_threshold: 0.55
    review_threshold: 0.65
    reject_threshold: 0.85
    scoring_scale: "[0.0, 1.0] continuous calibrated"

  # 2. GPR Trajectory Safety Slope (Module B temporal velocity metric)
  # Evaluates whether the predicted drift rate over time exceeds safe bounds.
  gpr_safety_slope:
    max_drift_rate_per_hour: 0.0015  # Max allowable parameter drift per hour
    max_total_168h_drift_pct: 25.0   # Max allowable % drift from 0h to 168h
    uncertainty_coverage: "2.0_sigma"  # 95.45% confidence interval

  # 3. Engineering Specification Limits (Datasheet physical boundaries)
  # CRITICAL SEPARATION RULE: For D1 and D2, normalized proxy ranges must NOT
  # be presented as authentic ISRO limits. If authentic limits are unconfigured,
  # the system marks them unavailable and relies on statistical and drift criteria.
  engineering_limits:
    authentic_limits_configured: false
    status: "UNAVAILABLE_FOR_ANONYMIZED_PROXIES"
    disclaimer: "Current normalized D1/D2 ranges are statistical proxies and must not be presented as authentic ISRO engineering limits."
    max_peer_zscore: 4.5  # Statistical peer tolerance (sigma)

rules:
  REJECT:
    conditions:
      - "Gross out-of-specification violation verified by trusted measurement (when authentic limits are configured)"
      - "Anomaly score exceeds reject_threshold (>= 0.85) AND GPR safety slope verifies unacceptable trajectory degradation with high confidence"
    action: "Reject component from flight/screening lot; preserve immutable audit evidence"

  RETEST:
    conditions:
      - "Data quality status is QUARANTINE or critical validation check failed"
      - "Sensor saturation, contact bounce, clock mismatch, or unresolvable unit ambiguity"
    action: "Order re-test of component; do not condemn hardware on untrusted data"

  REVIEW:
    conditions:
      - "Anomaly score is between review_threshold and reject_threshold (0.65 <= score < 0.85)"
      - "GPR forecast projects trajectory limit crossing but predictive uncertainty interval is wide (uncertain evidence)"
      - "Strong common-mode signal detected across peer population (potential chamber or test-fixture confounder)"
      - "In-spec but anomalous peer-relative deviation (> 3.0 sigma)"
    action: "Route to Human QA / Engineering disposition with complete evidence pack"

  PASS:
    conditions:
      - "Data quality verified as trusted"
      - "Anomaly score is below review_threshold (< 0.65)"
      - "Forecast trajectory remains stable within nominal safety slope"
      - "All configured engineering rules satisfied"
    action: "Nominal screening outcome; component approved for next screening stage"
